name: Installed Linux sandbox host pilot
on:
  pull_request:
    paths:
      - "src/shards_agent_os/**"
      - "deploy/systemd/**"
      - "scripts/ci_sandbox_host_pilot.py"
      - ".github/workflows/sandbox-host-pilot.yml"
      - "pyproject.toml"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-systemd-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install trusted Agent OS pilot virtualenv and published kernel
        run: |
          sudo mkdir -p /opt/shards-agent-os
          sudo "$(command -v python)" -m venv /opt/shards-agent-os/venv
          sudo /opt/shards-agent-os/venv/bin/python -m pip install --disable-pip-version-check '.[kernel]'
          # Some hosted runners inherit a group-writable umask. The trusted
          # installed package, scripts and ancestors must be immutable to
          # unprivileged users before provisioning a Docker-authorised service.
          sudo chmod -R go-w /opt/shards-agent-os
          sudo /opt/shards-agent-os/venv/bin/python -c 'import importlib.metadata as m; assert m.version("shards-kernel") == "0.1.3"'
          /opt/shards-agent-os/venv/bin/shards-agent-os-bootstrap --agent-user shards-agent
      - name: Register real gVisor runsc runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -qq
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
      - name: Preload fixed candidate image and publish digest for test
        run: |
          docker pull busybox:1.36
          echo "SHARDS_SANDBOX_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' busybox:1.36)" >> "$GITHUB_ENV"
      - name: Real systemd installed broker, signed sandbox and restart acceptance
        env:
          SHARDS_HOST_PILOT_CI: "1"
        run: |
          /opt/shards-agent-os/venv/bin/python scripts/ci_sandbox_host_pilot.py
          sudo systemd-analyze verify /etc/systemd/system/shards-agent-os-broker.service
      - name: Verify controlled service cleanup and no owned orphan containers
        if: always()
        run: |
          sudo systemctl stop shards-agent-os-broker.service || true
          if [ -e /run/shards-sandbox/broker.sock ]; then
            echo "Unexpected surviving broker socket"
            exit 1
          fi
          containers="$(docker ps -a --filter label=shards.agent-os.sandbox=1 --format '{{.Names}}' || true)"
          if [ -n "$containers" ]; then
            echo "Unexpected surviving sandbox workloads"
            exit 1
          fi
