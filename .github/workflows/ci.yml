name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application and published Shards-Kernel 0.1.3
        run: python -m pip install -e '.[kernel]'
      - name: Assert requested interpreter and installed package compatibility
        shell: bash
        env:
          TARGET_PYTHON: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import sys
          import os

          expected = tuple(map(int, os.environ["TARGET_PYTHON"].split(".")))
          assert sys.version_info[:2] == expected, (
              f"Expected CPython {expected}, got {sys.version_info[:2]}"
          )
          assert metadata.version("shards-kernel") == "0.1.3"
          assert metadata.version("shards-agent-os") == "0.3.0"
          print(f"Verified Python {sys.version_info.major}.{sys.version_info.minor}, "
                f"published Shards-Kernel 0.1.3 and Agent OS 0.3.0")
          PY
      - name: Check resolved dependencies
        run: python -m pip check
      - name: Assert live integration prerequisites
        run: python -c 'import importlib.metadata as m; import shards_agent_os, shards_kernel, mcp, cryptography; assert m.version("shards-kernel") == "0.1.3"; assert shards_kernel.__version__ == "0.1.3"; print("Published Shards-Kernel 0.1.3 and live test dependencies installed")'
      - name: Unit and real-process signed MCP integration tests
        run: python -Werror::ResourceWarning -m unittest discover -s tests -v
      - name: Verify installed kernel CLI and offline permit demo
        run: |
          python -m shards_kernel --version
          python -m shards_kernel demo --json
      - name: Compile application and build wheel
        run: |
          python -m compileall -q src/shards_agent_os
          python -m pip wheel --no-deps . -w dist
          python -m zipfile -l dist/shards_agent_os-0.3.0-py3-none-any.whl
          shards-agent-os --help
