name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and Shards-Kernel
        run: python -m pip install -e '.[kernel]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify installed kernel CLI
        run: |
          python -m shards_kernel --version
          python -m shards_kernel demo --json
