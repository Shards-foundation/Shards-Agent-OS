# Standalone configuration. No distribution includes, default site or access log.
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so

Listen 127.0.0.1:18443 https
ServerName agentos-origin-stage.shardsinc.co.uk
DefaultRuntimeDir "${RUNTIME_DIRECTORY}"
PidFile "${RUNTIME_DIRECTORY}/httpd.pid"
DocumentRoot "${RUNTIME_DIRECTORY}"
ErrorLog /dev/null
ServerTokens Prod
ServerSignature Off
TraceEnable Off
StartServers 1
ServerLimit 1
ThreadsPerChild 12
MaxRequestWorkers 12
MinSpareThreads 1
MaxSpareThreads 12
Timeout 90
<Directory />
    Require all denied
</Directory>

<VirtualHost 127.0.0.1:18443>
    ServerName agentos-origin-stage.shardsinc.co.uk
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "${CREDENTIALS_DIRECTORY}/leaf.pem"
    SSLCertificateKeyFile "${CREDENTIALS_DIRECTORY}/tls.key"

    Header always set X-Shards-Stage-TLS "1"
    ProxyRequests Off
    ProxyAddHeaders Off
    LimitRequestBody 8192
    RewriteEngine On
    RewriteCond %{SSL:SSL_TLS_SNI} !^agentos-origin-stage\.shardsinc\.co\.uk$ [NC,OR]
    RewriteCond %{HTTP_HOST} !^agentos-origin-stage\.shardsinc\.co\.uk(:18443)?$ [NC]
    RewriteRule ^ - [R=421,L]

    # Match the Worker mount. A fixed upstream receives the original query,
    # signed headers, browser Origin and session cookie. No redirect rewriting.
    RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
    RewriteRule ^/?(agent-os/(?:turn/[a-f0-9]{32})?)$ http://127.0.0.1:12026/$1 [P,L]
    RewriteCond %{REQUEST_METHOD} ^POST$
    RewriteRule ^/?(agent-os/(?:ask|logout))$ http://127.0.0.1:12026/$1 [P,L]
    RewriteRule ^ - [R=404,L]
</VirtualHost>
