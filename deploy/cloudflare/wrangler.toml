# Cloudflare Worker integration for agents.shardsinc.co.uk
#
# This is a PATCH to the existing `shards-agent-hub-ai` Worker, not a new
# Worker. Copy `worker.mjs` over the deployed Worker's entry module, keep the
# existing bindings, and add the two new secrets.
#
# Do not run `wrangler deploy` from a workstation that also serves the Agent OS
# origin. See README.md for the exact ordered procedure and the blockers.

name = "shards-agent-hub-ai"
main = "worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "agents.shardsinc.co.uk/*", zone_name = "shardsinc.co.uk" }
]

# Existing Workers AI binding. `@cf/qwen/qwen3.8-27b` is invoked through it;
# no API key exists anywhere for this path.
[ai]
binding = "AI"

# Existing service binding to the MCP gateway.
[[services]]
binding = "MCP_GATEWAY"
service = "shards-mcp-gateway"

# --- Required new configuration (set as Worker secrets, never in this file) ---
#
#   wrangler secret put ACCESS_TEAM_DOMAIN      # gentle-shape-bee5.cloudflareaccess.com
#   wrangler secret put ACCESS_AUD              # the Access application AUD tag
#   wrangler secret put ORIGIN_BASE_URL         # https://<origin host>  (https only)
#   wrangler secret put ORIGIN_ASSERTION_SECRET # openssl rand -base64 48
#
# ORIGIN_ASSERTION_SECRET must be byte-identical to the origin's
# SHARDS_EDGE_ASSERTION_SECRET. The origin refuses to start with fewer than 32
# bytes, and `web_server.verify_assertion` compares with `compare_digest`.

[observability]
enabled = true

# Keep the Access guard. Removing it would make `readActor` fail closed for
# every request, so the site would break rather than become open — but do not
# remove it either way.
