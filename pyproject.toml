[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shards-agent-os"
version = "0.1.0"
description = "Application-level scheduler using Shards-Kernel's governed execution interface"
requires-python = ">=3.11"
license = {text = "BSL-1.0"}
dependencies = []

[project.optional-dependencies]
# Temporary immutable source pin until PyPI 0.1.2 is published and verified.
kernel = ["shards-kernel[crypto,mcp] @ git+https://github.com/Shards-foundation/Shards-kernel.git@4d521d6aa3c523bdea905de50f50be4133321020"]

[project.scripts]
shards-agent-os = "shards_agent_os.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
