[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shards-agent-os"
version = "0.1.0"
description = "Application-level scheduler using Shards-Kernel's governed execution interface"
requires-python = ">=3.11"
license = {text = "BSL-1.0"}
dependencies = []

[project.optional-dependencies]
kernel = ["shards-kernel[crypto,mcp]==0.1.2"]

[project.scripts]
shards-agent-os = "shards_agent_os.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
