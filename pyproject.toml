[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shards-agent-os"
version = "0.3.0"
description = "Single-host, fail-closed application runtime governed by Shards-Kernel"
requires-python = ">=3.11"
license = {text = "BSL-1.0"}
dependencies = []

[project.optional-dependencies]
kernel = ["shards-kernel[crypto,mcp]==0.1.3"]

[project.scripts]
shards-agent-os = "shards_agent_os.__main__:main"
shards-agent-os-sandbox = "shards_agent_os.sandbox_operator:main"
shards-agent-os-broker = "shards_agent_os.sandbox_broker:main"
shards-agent-os-sandbox-call = "shards_agent_os.sandbox_client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
